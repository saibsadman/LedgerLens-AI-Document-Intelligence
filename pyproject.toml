[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel"
version = "1.0.0"
description = "AI-powered document intelligence system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.17",
  "pypdf>=5.1,<6",
  "pymupdf>=1.24,<2",
  "pillow>=11,<12",
  "pytesseract>=0.3.13,<1",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "charset-normalizer>=3.4,<4",
  "python-dateutil>=2.9,<3",
  "celery[redis]>=5.4,<6",
  "psycopg[binary]>=3.2,<4",
  "openai>=1.60,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.8,<1"]
recording = ["playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

